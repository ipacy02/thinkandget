name: "Think & Get it Frontend CI"

on:
  push:
    branches: [ master, ft/addToCart, ft/auth-security-validation, ft/filter,  ft/registration ]
  pull_request:
    branches: [ master, ft/addToCart, ft/auth-security-validation, ft/filter,  ft/registration ]
  schedule:
    # Runs at 00:00 UTC every day (Adjust the cron expression as needed)
    - cron: '0 8 * * *'
  workflow_dispatch: # This allows you to trigger the workflow manually from GitHub

jobs:
  frontend-build-test:
    name: "Frontend CI Pipeline"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-node-version: '20' # Specify your frontend Node version here
          cache: 'npm'           # Automatically caches node_modules for faster runs

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter / Code Formatting Check
        run: npm run lint --if-present

      - name: Run Frontend Tests
        run: npm test --if-present

      - name: Build Project
        run: npm run build --if-present